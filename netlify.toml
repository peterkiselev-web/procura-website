# Netlify build and serving settings for the Procura site.
[build]
  command = "node build.js"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Source files and the local server are not part of the published site.
[[redirects]]
  from = "/src/*"
  to = "/404.html"
  status = 404
